<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 ถึงคนพิเศษ</title>

<link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Mali',cursive;
}

body{
    background:linear-gradient(135deg,#ffd6e8,#ffeaf4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.card{
    width:90%;
    max-width:420px;
    background:white;
    border-radius:25px;
    padding:35px;
    text-align:center;
    box-shadow:0 10px 30px rgba(255,105,180,.2);
    animation:fade .6s;
}

h1{
    color:#ff5f9d;
    margin-bottom:20px;
}

p{
    color:#555;
    line-height:1.9;
    margin:12px 0;
}

button{
    margin-top:25px;
    border:none;
    background:#ff74ad;
    color:white;
    padding:14px 28px;
    border-radius:50px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
    background:#ff4e95;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.heart{
position:absolute;
color:pink;
font-size:20px;
animation:float 7s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

.big{
font-size:28px;
color:#ff4d94;
font-weight:bold;
}
</style>

</head>
<body>

<div class="card">

<h1 id="title">💌 ถึงคนพิเศษ</h1>

<div id="content">

<p>มีข้อความหนึ่ง...</p>

<p>ที่ผมอยากให้บี๋อ่านจนจบ</p>

<p>พร้อมแล้วกดปุ่มด้านล่างนะ 😊</p>

</div>

<button onclick="nextPage()">เริ่มอ่าน 💗</button>

</div>

<script>

const pages=[

`
<p>สวัสดีนะบี๋ของผมม 👋</p>

<p>ถ้าบี๋กำลังอ่านข้อความนี้อยู่</p>

<p>แปลว่าบี๋ยอมสแกน QR Code ของผมแล้ว</p>

<p>ขอบคุณนะ ❤️</p>
`,

`
<p>ช่วงเกือบเดือนที่ผ่านมา</p>

<p>จากคนที่ไม่รู้จักกัน</p>

<p>กลายเป็นคนที่ผมรอคุยทุกวัน</p>

<p>ผมยังรู้สึกแปลกใจเลยนะ</p>

<p>ว่าเวลาแค่นี้</p>

<p>ทำไมบี๋ถึงกลายเป็นคนสำคัญกับผมขนาดนี้</p>
`,

`
<p>ผมไม่รู้เหมือนกันว่าเริ่มตั้งแต่เมื่อไหร่</p>

<p>ที่ผมเริ่มรอข้อความจากบี๋</p>

<p>เริ่มอยากเล่าเรื่องต่าง ๆ ให้บี๋ฟัง</p>

<p>และเริ่มรู้สึกว่า</p>

<p>ในแต่ละวันของผมมีบี๋อยู่แล้ว ❤️</p>
`,

`
<p>บี๋เป็นคนแรกเลยนะ</p>

<p>ที่ทำให้ผมได้รับความรู้สึกแบบนี้</p>

<p>เป็นคนแรกที่บอกคิดถึง</p>

<p>บอกรักผมทุกวัน</p>

<p>เป็นคนแรกที่ทำให้ผมรู้สึกว่า</p>

<p>ผมมีใครสักคนที่คอยอยู่ข้าง ๆ</p>
`,

`
<p>แค่ข้อความธรรมดา ๆ จากบี๋</p>

<p>หรือคำว่าคิดถึงกับบอกรัก</p>

<p>มันก็ทำให้ผมยิ้มได้แล้ว</p>

<p>และทำให้วันธรรมดาของผมดีขึ้นมาก</p>

<p>ทุกครั้งที่ได้คุยกับบี๋</p>

<p>มันทำให้ผมมีความสุขมาก ๆ</p>
`,

`
<p>ขอบคุณนะบี๋</p>

<p>ที่เข้ามาในชีวิตของผม</p>

<p>ขอบคุณที่คอยใส่ใจผม</p>

<p>ขอบคุณที่ทำให้ผมรู้สึกว่า</p>

<p>ผมเป็นคนสำคัญของใครสักคน</p>
`,

`
<p>จริง ๆ แล้ว...</p>

<p>ผมอยากบอกบี๋อย่างหนึ่ง</p>

<p>ผมอาจจะไม่ใช่คนที่เก่งเรื่องความรัก</p>

<p>ไม่ค่อยโรแมนติก</p>

<p>ไม่ค่อยพูดหวาน ๆ เก่ง</p>

<p>บางครั้งผมก็เขิน</p>

<p>จนแสดงออกไม่เก่ง</p>

<p>แต่ผมอยากให้บี๋รู้ว่า</p>

<p>ผมจะพยายามทำให้บี๋มีความสุขที่สุดนะ ❤️</p>
`,

`
<p>ถ้าวันไหนบี๋เหนื่อย</p>

<p>หรือมีเรื่องไม่สบายใจ</p>

<p>บี๋มาเล่าให้ผมฟังได้นะ</p>

<p>ถึงผมอาจจะปลอบไม่เก่ง</p>

<p>แต่ผมพร้อมที่จะอยู่ข้าง ๆ บี๋เสมอ</p>

<p>ถ้าวันนั้นเราได้อยู่ด้วยกัน</p>

<p>ผมอาจจะพูดไม่เก่ง</p>

<p>แต่ผมจะกอดบี๋แทนคำพูดนะ ❤️</p>
`,

`
<p>ถ้ามีอะไรที่ผมทำแล้ว</p>

<p>ทำให้บี๋ไม่สบายใจ</p>

<p>หรือมีอะไรที่ผมควรปรับปรุง</p>

<p>บี๋บอกผมได้นะ</p>

<p>ผมพร้อมที่จะฟัง</p>

<p>และพร้อมที่จะพยายามแก้ไข</p>

<p>เพราะผมอยากให้เราสองคนมีความสุขไปด้วยกัน ❤️</p>
`,
    
`
<p>แล้วก็มีอีกอย่างที่ผมอยากให้บี๋รู้</p>

<p>ตอนนี้คนที่ผมอยากดูแล</p>

<p>คนที่ผมอยากอยู่ข้าง ๆ</p>

<p>มีแค่บี๋คนเดียวนะ ❤️</p>

<p>ผมอยากตั้งใจรักษาความรู้สึกดี ๆ ที่เรามีให้กัน</p>

<p>และจะพยายามทำให้บี๋รู้สึกว่า</p>

<p>บี๋เป็นคนพิเศษของผมเสมอ</p>
`,
    
`
<p>ผมไม่รู้ว่าต่อจากนี้จะเป็นยังไง</p>

<p>แต่ผมอยากให้บี๋รู้ว่า</p>

<p>ผมดีใจมากนะ</p>

<p>ที่ได้เจอบี๋ ❤️</p>

<br>

<p>มีอีกหนึ่งเรื่อง</p>

<p>ที่ผมอยากบอกบี๋</p>

<p>แต่ผมอยากพูดมัน</p>

<p>ต่อหน้าบี๋มากกว่า</p>

<br>

<p>ก่อนจะทำอะไรต่อ</p>

<p>บี๋มองที่โทรศัพท์ก่อนนะ 555</p>

<p>อ่านให้จบก่อนนะ ❤️</p>

<br>

<p>พร้อมไหม?</p>

<p id="count"></p>
`

];

let current=0;

function nextPage(){

    if(current < pages.length){

        document.getElementById("content").innerHTML = pages[current];

        current++;

        if(current == pages.length){

            let btn = document.querySelector("button");

            btn.innerHTML = "💗 พร้อมแล้ว";

            btn.onclick = startCount;

        }else{

            document.querySelector("button").innerHTML = "ถัดไป ➜";

        }

    }

}


function startCount(){

    let n = 3;

    let button = document.querySelector("button");

    button.style.display = "none";


    let count = document.getElementById("count");


    let timer = setInterval(()=>{


        count.innerHTML = n + "...";


        n--;


        if(n < 0){


            clearInterval(timer);


            count.innerHTML = `
            <p class="big">
            🌹 ลองหันมาหาผมหน่อยนะบี๋ ❤️
            </p>
            `;


        }


    },1000);

}

function heart(){

const h=document.createElement("div");

h.className="heart";

h.innerHTML=Math.random()>0.5?"💗":"🌸";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(15+Math.random()*20)+"px";

h.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},9000);

}

setInterval(heart,500);

</script>

</body>
</html>
